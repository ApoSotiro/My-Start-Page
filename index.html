<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Gaming Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>


<button id="themeButton">
    ☀️
</button>



<div class="container">



    <!-- CLOCK -->

    <div class="clock">

        <div class="number number12">12</div>
        <div class="number number3">3</div>
        <div class="number number6">6</div>
        <div class="number number9">9</div>


        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>


        <div class="center"></div>

    </div>





    <!-- SEARCH -->

    <div class="searchBox">


        <input 
        id="searchInput"
        placeholder="Αναζήτηση...">


        <button id="searchButton">
            GO
        </button>


        <div class="engineSelector">


            <button id="engineButton">

                🌐 Google ▼

            </button>



            <div id="engineMenu">


                <div data-engine="google">

                    🌐 Google

                </div>


                <div data-engine="bing">

                    🔷 Bing

                </div>


                <div data-engine="duckduckgo">

                    🦆 DuckDuckGo

                </div>


            </div>


        </div>



    </div>






    <!-- CARDS -->


    <div id="cardsContainer" class="cardsContainer">


        <button id="addCard" class="card addCard">

            +

        </button>


    </div>




</div>








<!-- MODAL -->


<div id="modal" class="modal">


    <div class="modalBox">


        <h2>
            Νέα καρτέλα
        </h2>



        <input 
        id="cardName"
        placeholder="Όνομα">



        <input
        id="cardUrl"
        placeholder="URL">





        <div class="modalButtons">


            <button id="saveCard">
                Αποθήκευση
            </button>


            <button id="cancelCard">
                Άκυρο
            </button>


        </div>


    </div>


</div>





<script src="script.js"></script>


</body>

</html>
